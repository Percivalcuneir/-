name: build apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: make android project
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android pdfjs-dist@3.11.174 jszip mammoth
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js node_modules/jszip/dist/jszip.min.js node_modules/mammoth/mammoth.browser.min.js www/
          npx cap init app com.joel.vibes --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">🍄🏔️🌀🏝️</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">🍄🏔️🌀🏝️</string>|' android/app/src/main/res/values/strings.xml

      - name: app logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_round.png
            convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf $R/mipmap-anydpi-v26

      - name: build apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vibes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
